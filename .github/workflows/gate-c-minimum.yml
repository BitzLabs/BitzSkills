# Gate Cの下限環境証拠は、対象refを選んで明示的に起動した場合だけ採取する。
name: Gate C下限環境の証拠採取

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-c-minimum-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  collect:
    name: 下限環境の証拠採取
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: fresh checkoutで全適合fixtureとCore単体試験を実行
        run: |
          uv run tests/bitz-core/certify_gate_c.py run \
            --role minimum \
            --environment-id minimum-cpython-3-12 \
            --python 3.12 \
            --output "$RUNNER_TEMP/bitz-gate-c-minimum.json"
      - name: 下限環境証拠の保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gate-c-minimum-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bitz-gate-c-minimum.json
          if-no-files-found: error
          retention-days: 30
