# AGENTS.md「検証コマンド」を GitHub Actions で実行する。
# PR と main への push では fixture 監査・単体試験・適合試験を、main への push・週次・手動では
# Gate Aと、独立した2組の分割結果によるGate B認定も実行する（ADR-056）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"  # 毎週月曜 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    name: 適合fixtureの監査
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: validate_conformance.py
        # 正常時は exit 1 で、pending は Gate A 認定だけが置き換える 1 項目になる。
        # 判定は fixtures/certify_gate_a.py と同じ条件で行う。
        run: |
          set +e
          uv run fixtures/validate_conformance.py > "$RUNNER_TEMP/audit.json"
          code=$?
          set -e
          python3 - "$code" "$RUNNER_TEMP/audit.json" <<'EOF'
          import json, sys
          code = int(sys.argv[1])
          report = json.load(open(sys.argv[2], encoding="utf-8"))
          failed = sorted(name for name, check in report["checks"].items() if check.get("errors"))
          pending = report["pending"]
          print(json.dumps({"exitCode": code, "failed": failed, "pending": pending}, ensure_ascii=False, indent=2))
          if failed or pending != ["full Gate A fresh-checkout repeatability"] or code != 1:
              sys.exit("適合fixtureの監査が正常な状態ではありません")
          EOF

  unit:
    name: Coreの単体試験
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: run_test_files.py
        run: uv run --project plugins/bitz-core python tests/bitz-core/run_test_files.py tests/bitz-core/test_*.py
      - name: 適合harnessの計時・選択と比較の試験
        run: uv run --with jsonschema==4.23.0 python -m unittest fixtures.conformance.test_runner fixtures.conformance.test_execution

  plan:
    name: 適合試験の分割計画
    runs-on: ubuntu-24.04
    outputs:
      step: ${{ steps.plan.outputs.step }}
      replica-count: ${{ steps.plan.outputs.replica-count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          step=$(python3 -c 'import json; print(max(s["step"] for s in json.load(open("fixtures/conformance/steps.json"))["steps"]))')
          replicas=2
          if [ "$EVENT_NAME" = pull_request ]; then replicas=1; fi
          python3 fixtures/plan_conformance.py --step "$step" --shards 4 --replicas "$replicas" \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"

  conformance-shards:
    name: 適合試験 ${{ matrix.replica }} / 分割 ${{ matrix.shard }}（予測 ${{ matrix.predicted }}）
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: 独立checkoutでbuild・適合試験・Parser検査
        env:
          STEP: ${{ needs.plan.outputs.step }}
          REPLICA: ${{ matrix.replica }}
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          uv run tests/bitz-core/ci_gate_b.py run --step "$STEP" --replica "$REPLICA" \
            --shard "$SHARD" --shards 4 --run-id "$RUN_ID" --output "$RUNNER_TEMP/conformance"
      - name: 分割結果と工程別時間の保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          overwrite: true
          name: conformance-${{ matrix.replica }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/conformance/
          if-no-files-found: error

  conformance:
    name: Coreの適合試験
    needs: [plan, conformance-shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: conformance-*
          path: ${{ runner.temp }}/conformance
          merge-multiple: true
      - name: 全件の網羅と独立実行の一致を判定
        env:
          STEP: ${{ needs.plan.outputs.step }}
          REPLICAS: ${{ needs.plan.outputs.replica-count }}
          WORKERS_RESULT: ${{ needs.conformance-shards.result }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test "$WORKERS_RESULT" = success
          uv run tests/bitz-core/ci_gate_b.py collect --step "$STEP" --replicas "$REPLICAS" \
            --shards 4 --run-id "$RUN_ID" --input "$RUNNER_TEMP/conformance" \
            --output "$RUNNER_TEMP/conformance-result.json"
      - name: 集約結果の保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          overwrite: true
          name: conformance-result
          path: ${{ runner.temp }}/conformance-result.json
          if-no-files-found: ignore

  certify:
    name: Gate A 認定
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: certify_gate_a.py
        run: uv run fixtures/certify_gate_a.py
